<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-F-CAL</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
    <p>WORKS MORE EFFICIENT AND FLEXIBLE</p>
    <section class="hold">

<table border="5">

<tr>
<th colspan="6"><input type="text" placeholder=" enter value" class="value" id="for" readonly></th>

</tr>

<tr>
    <th colspan="4"> <div class="show-time" id="realtime"></div></th>
  

    <th> <button class="switch-off" onclick="clearAll()">off</button></th>

    <th> <button class="switch-on" onclick="clearAll()">on</button></th>

</tr>

<tr>
    <th> <button class="evaluate" onclick="mathFunc('sin')">sin</button></th>
    <th> <button class="evaluate" onclick="mathFunc('cos')">cos</button></th>

    <th> <button class="evaluate" onclick="mathFunc('tan')">tan</button></th>

    <th> <button class="number" onclick="addToDisplay('0.5')">½</button></th>

    <th> <button class="number" onclick="addToDisplay('/100')">%</button></th>

    <th> <button class="function">MC</button></th>

</tr>

<tr>
    <th> <button class="symbol" onclick="mathFunc('sqrt')">✓</button></th>
    <th> <button class="symbol" onclick="addToDisplay('(')">(</button></th>

    <th> <button class="symbol" onclick="addToDisplay(')')">)</button></th>

    <th> <button class="symbol" onclick="addToDisplay('/')">÷</button></th>

    <th> <button class="number" onclick="addToDisplay('**2')">10<sup>2</sup></button></th>

    <th> <button class="function">MR</button></th>

</tr>

<tr>
    <th> <button class="number" onclick="addToDisplay('7')">7</button></th>
    <th> <button class="number" onclick="addToDisplay('8')">8</button></th>

    <th> <button class="number" onclick="addToDisplay('9')">9</button></th>

    <th> <button class="symbol" onclick="addToDisplay('*')" >×</button></th>

    <th> <button class="symbol" onclick="addToDisplay('**')">x<sup>y</sup></button></th>

    <th> <button class="function">M+</button></th>

</tr>


<tr>
    <th> <button class="number" onclick="addToDisplay('4')" >4</button></th>
    <th> <button class="number" onclick="addToDisplay('5')">5</button></th>

    <th> <button class="number" onclick="addToDisplay('6')">6</button></th>

    <th> <button class="symbol" onclick="addToDisplay('-')">-</button></th>

    <th> <button class="symbol" onclick="addToDisplay('**2')">x<sup>2</sup></button></th>

    <th> <button class="function">M-</button></th>

</tr>

<tr>
    <th> <button class="number" id="one" onclick="addToDisplay('1')" >1</button></th>
    <th> <button class="number" id="two" onclick="addToDisplay('2')">2</button></th>

    <th> <button class="number"onclick="addToDisplay('3')">3</button></th>

    <th> <button class="symbol"  onclick="addToDisplay('+')">+</button></th>

    <th> <button class="delet" onclick="clearAll()">clear</button></th>

    <th> <button class="function">MS</button></th>

</tr>
<tr>
    <th> <button class="symbol" onclick="addToDisplay('.')">•</button></th>
    <th> <button class="number" onclick="addToDisplay('0')">0</button></th>

    <th> <button class="symbol" onclick="plusMinus()">±</button></th>

    <th> <button class="symbol" onclick="calculate()">=</button></th>

    <th> <button class="symbol" onclick="backspace()">⇐</button></th>

    <th> <button class="function">M^</button></th>

</tr>


</table>

    </section>

    <script>
        const display = document.getElementById('for');

        function addToDisplay(value) {
            display.value += value;
        }

        function clearAll() {
            display.value = "";
        }

        function backspace() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = "Error";
            }
        }

        function plusMinus() {
            if(display.value !== "") {
                if(display.value.charAt(0) === '-') {
                    display.value = display.value.slice(1);
                } else {
                    display.value = '-' + display.value;
                }
            }
        }

        function mathFunc(type) {
            let val = parseFloat(display.value);
            if (isNaN(val)) return;
            
            if (type === 'sin') display.value = Math.sin(val * Math.PI / 180).toFixed(4);
            if (type === 'cos') display.value = Math.cos(val * Math.PI / 180).toFixed(4);
            if (type === 'tan') display.value = Math.tan(val * Math.PI / 180).toFixed(4);
            if (type === 'sqrt') display.value = Math.sqrt(val).toFixed(4);
        }
function updateTime() {
    const now = new Date();
    
    let hours = now.getHours();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');
    
    const day = now.getDate().toString().padStart(2, '0');
    const month = (now.getMonth() + 1).toString().padStart(2, '0'); 
    const year = now.getFullYear();
    
    document.getElementById("realtime").innerHTML = `${hours}:${minutes}:${seconds} ${ampm} | ${day}/${month}/${year}`;

}
setInterval(updateTime, 1000);
updateTime();
    </script>

</body>
</html>
